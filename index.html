async function loadRemoteSettings(){
  const {data,error}=await supabaseClient
    .from('settings')
    .select('*')
    .limit(1)
    .maybeSingle();

  if(error){
    console.log('Settings error:',error.message);
    return;
  }

  if(data){
    D.settings={
      company:data.company||D.settings.company,
      slogan:data.slogan||D.settings.slogan,
      whatsapp:data.whatsapp||D.settings.whatsapp,
      instagram:data.instagram||D.settings.instagram,
      background:data.background||''
    };
    save();
    render();
  }
}

async function saveRemoteSettings(){
  const {data,error}=await supabaseClient
    .from('settings')
    .select('id')
    .limit(1)
    .maybeSingle();

  if(error){
    return toast('خطأ في الإعدادات: '+error.message);
  }

  const values={
    company:D.settings.company,
    slogan:D.settings.slogan,
    whatsapp:D.settings.whatsapp,
    instagram:D.settings.instagram,
    background:D.settings.background||'',
    updated_at:new Date().toISOString()
  };

  let result;

  if(data){
    result=await supabaseClient
      .from('settings')
      .update(values)
      .eq('id',data.id);
  }else{
    result=await supabaseClient
      .from('settings')
      .insert([values]);
  }

  if(result.error){
    return toast('لم يتم حفظ الإعدادات: '+result.error.message);
  }

  save();
  toast('تم حفظ الإعدادات للجميع ✅');
  render();
}

function cartPage(){let items=cart.map(x=>({...x,p:D.products.find(p=>p.id===x.id)}));let total=items.reduce((s,x)=>s+x.p.price*x.qty,0);return pageBox('السلة','راجع طلبك قبل الإرسال.',`<div>${items.map(x=>`<div class=cartRow><b>${esc(x.p.name)}</b><div class=qty><button onclick="changeQty(${x.id},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${x.id},1)">+</button></div><strong>${x.p.price*x.qty} ج</strong></div>`).join('')||'<p>السلة فارغة.</p>'}</div><div class=paymentBox>💵 كاش: متاح<br>📸 إنستجرام/تحويل: ${D.settings.instagram}<br>📞 الشكاوى: ${D.settings.whatsapp}</div><div class=total>الإجمالي <b>${total} جنيه</b></div><button class="primary wide" onclick="sendOrder()">إرسال الطلب</button>`)}function sendOrder(){if(!cart.length)return toast('السلة فارغة');let items=cart.map(x=>({productId:x.id,qty:x.qty}));for(let x of items){let p=D.products.find(y=>y.id===x.productId);if(!p||Number(p.stock)<x.qty)return toast('الكمية المطلوبة غير متاحة حاليًا')}items.forEach(x=>D.products.find(p=>p.id===x.productId).stock-=x.qty);D.orders.push({id:'CC-'+Math.floor(100000+Math.random()*899999),clientId:client.id,items,total:items.reduce((s,x)=>s+D.products.find(p=>p.id===x.productId).price*x.qty,0),status:'جديد',createdAt:new Date().toISOString()});cart=[];save();toast('تم إرسال الطلب');setPage('orders')}
function orders(){let os=D.orders.filter(o=>o.clientId===client.id).reverse();return pageBox('طلباتي','جديد ← قيد التجهيز ← خرج للتوصيل ← تم التسليم',os.map(o=>`<div class=order><b>${o.id}</b> <span class=status>${o.status}</span><p>${o.items.map(i=>{let p=D.products.find(p=>p.id===i.productId);return esc(p?.name||'صنف')+' × '+i.qty}).join('، ')}</p><strong>${o.total} جنيه</strong></div>`).join('')||'<p>لسه مفيش طلبات.</p>')}
function missing(){return pageBox('اطلب الصنف الناقص','اكتب أي صنف مش موجود.',`<form class=form onsubmit="miss(event)"><label>اسم الصنف<input id=mn required placeholder="مثال: شامبو كلير"></label><button class="primary wide">إرسال</button></form><div class=adminList>${D.missing.filter(x=>x.clientId===client.id).reverse().map(x=>`<div class=adminCard><b>${esc(x.name)}</b><span class=status>${x.status}</span></div>`).join('')}</div>`)}function miss(e){e.preventDefault();D.missing.push({id:Date.now(),clientId:client.id,clientName:client.name,business:client.business,name:mn.value,status:'جديد'});save();toast('تم إرسال طلب الصنف الناقص');render()}

let atab='clients';function can(k){return admin?.owner||admin?.permissions?.[k]}function adminPage(){if(!can(atab))atab=['clients','orders','products','videos','missing','settings','admins'].find(can)||'clients';let tabs=[['clients','العملاء'],['orders','الطلبات'],['products','المنتجات'],['videos','الفيديوهات'],['missing','الأصناف الناقصة'],['settings','الإعدادات'],['admins','المديرين']].filter(x=>can(x[0]));return pageBox('لوحة الإدارة — '+esc(admin.name),admin.owner?'عاصم لديه كل الصلاحيات':'صلاحياتك محددة من عاصم',`<div class=adminTabs>${tabs.map(x=>`<button class="chip ${atab===x[0]?'active':''}" onclick="atab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${adminTabBody()}`)}function adminTabBody(){if(atab==='clients')return clientsAdmin();if(atab==='orders')return ordersAdmin();if(atab==='products')return productsAdmin();if(atab==='videos')return videosAdmin();if(atab==='missing')return missingAdmin();if(atab==='settings')return settingsAdmin();return managersAdmin()}
function clientsAdmin(){let q=document.getElementById('cq')?.value||'';let cs=D.clients.filter(c=>(c.name+' '+c.phone+' '+c.business).includes(q));return `<button class="primary wide" onclick="loadRemoteClients()">🔄 تحديث العملاء من قاعدة البيانات</button><input id=cq class=search value="${esc(q)}" oninput="render()" placeholder="🔎 ابحث عن العميل"><div class=adminList>${cs.map(c=>{let os=D.orders.filter(o=>o.clientId===c.id);return `<div class=adminCard><div><b>${esc(c.name)}</b><p>${esc(c.business)} — ${c.activity}</p><small>${c.phone} — ${esc(c.address)}</small><p>عدد الطلبات: ${os.length} | إجمالي المسحوب: ${os.reduce((s,o)=>s+o.total,0)} جنيه</p></div><div><span class=status>${c.status}</span>${admin.owner&&c.status==='pending'?`<div style="margin-top:12px;display:flex;gap:8px"><button class="primary" onclick="approve('${c.id}')">✅ قبول</button><button class="danger" onclick="reject('${c.id}')">❌ رفض</button></div>`:''}</div></div>`}).join('')}</div>`}async function loadRemoteClients(){

async function approve(id){
  const {data,error}=await supabaseClient
    .from('clients')
    .update({status:'approved',reviewed_at:new Date().toISOString()})
    .eq('id',id)
    .select()
    .single();

  if(c)c.status='approved';
  save();
  toast('تمت الموافقة على العميل ✅');
  render();
}

    .from('clients')

    .eq('id',id)
    .select()
    .single();

  if(error)return toast('تعذر رفض العميل: '+error.message);

  if(c)c.status='rejected';
  save();
  toast('تم رفض العميل');
  render();
}
function ordersAdmin(){return `<div class=adminList>${D.orders.slice().reverse().map(o=>`<div class=adminCard><div><b>${o.id}</b><p>${D.clients.find(c=>c.id===o.clientId)?.name||'عميل'} — ${o.total} جنيه</p></div><select onchange="statusOrder(${o.id?o.id:0},this.value)" data-id="${o.id}"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='خرج للتوصيل'?'selected':''}>خرج للتوصيل</option><option ${o.status==='تم التسليم'?'selected':''}>تم التسليم</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select></div>`).join('')}</div>`}function statusOrder(_,v){let el=event.target,o=D.orders.find(x=>x.id===el.dataset.id);if(o){o.status=v;save()}}
function productsAdmin(){return `<div class=adminForm><label>اسم المنتج<input id=pn></label><label>الفئة<input id=pc></label><label>الوصف<input id=pd></label><label>السعر<input id=pp type=number></label><label>الكمية بالمخزن (للإدارة فقط)<input id=ps type=number></label><label>صورة المنتج<input id=pi type=file accept="image/*" onchange="fileData(this,x=>window.pimg=x)"></label><button class=primary onclick="addProductAdmin()">إضافة المنتج</button></div><div class=adminList>${D.products.map(p=>`<div class=adminCard>${p.image?`<img class=thumb src="${p.image}">`:''}<div><b>${esc(p.name)}</b><p>${p.price} جنيه — المخزون: ${p.stock}</p><small>${esc(p.description)}</small></div><button onclick="toggleProduct(${p.id})">${p.active===false?'إظهار':'إخفاء'}</button></div>`).join('')}</div>`}function addProductAdmin(){if(!pn.value||!pp.value||ps.value==='')return toast('اكتب الاسم والسعر والكمية');D.products.push({id:Date.now(),name:pn.value,category:pc.value,description:pd.value,price:+pp.value,stock:+ps.value,image:window.pimg||'',active:true});window.pimg='';save();render()}function toggleProduct(id){let p=D.products.find(x=>x.id===id);p.active=p.active===false;save();render()}
function videosAdmin(){return `<div class=adminForm><label>اسم الفيديو<input id=vn></label><label>الفيديو من المعرض<input type=file accept="video/*" onchange="fileData(this,x=>{window.vurl=x;window.vtype='video'})"></label><label>أو رابط فيديو<input id=vu></label><button class=primary onclick="addVideoAdmin()">إضافة الفيديو</button></div><div class=videoGrid>${D.videos.map(v=>`<div class=videoCard>${v.type==='video'?`<video class=video controls src="${v.url}"></video>`:`<a href="${v.url}" target="_blank">فتح الفيديو</a>`}<h3>${esc(v.title)}</h3></div>`).join('')}</div>`}function addVideoAdmin(){let url=window.vurl||vu.value;if(!vn.value||!url)return toast('اختار فيديو أو ضع رابطًا');D.videos.push({id:Date.now(),title:vn.value,url,type:window.vtype||'link'});window.vurl='';save();render()}
function missingAdmin(){return `<div class=adminList>${D.missing.slice().reverse().map(m=>`<div class=adminCard><div><b>${esc(m.name)}</b><p>${esc(m.clientName)} — ${esc(m.business)}</p></div><select onchange="mstatus(${m.id},this.value)"><option ${m.status==='جديد'?'selected':''}>جديد</option><option ${m.status==='تم توفيره'?'selected':''}>تم توفيره</option><option ${m.status==='غير متوفر'?'selected':''}>غير متوفر</option></select></div>`).join('')}</div>`}function mstatus(id,v){D.missing.find(x=>x.id===id).status=v;save()}
function settingsAdmin(){return `<form class=form><label>اسم الشركة<input id=sc value="${esc(D.settings.company)}"></label><label>الجملة<input id=ss value="${esc(D.settings.slogan)}"></label><label>واتساب والشكاوى<input id=sw value="${D.settings.whatsapp}"></label><label>إنستجرام/التحويل<input id=si value="${D.settings.instagram}"></label><label>خلفية الموقع من المعرض<input type=file accept="image/*" onchange="fileData(this,x=>window.bg=x)"></label><button type=button class=primary onclick="saveSettings()">حفظ الإعدادات</button></form>`}async function saveSettings(){
  Object.assign(D.settings,{
    company:sc.value,
    slogan:ss.value,
    whatsapp:sw.value,
    instagram:si.value
  });

  if(window.bg){
    const fileInput=document.querySelector('input[type="file"]');
    const file=fileInput?.files?.[0];

    if(file){
      const ext=file.name.split('.').pop().toLowerCase() || 'jpg';
      const fileName='background-' + Date.now() + '.' + ext;

      const {error:uploadError}=await supabaseClient
        .storage
        .from('site-assets')
        .upload(fileName,file,{upsert:true,contentType:file.type});

      if(uploadError){
        return toast('فشل رفع الخلفية: '+uploadError.message);
      }

      const {data:urlData}=supabaseClient
        .storage
        .from('site-assets')
        .getPublicUrl(fileName);

      D.settings.background=urlData.publicUrl;
    }
  }

  await saveRemoteSettings();
}
function managersAdmin(){let keys=[['clients','العملاء'],['orders','الطلبات'],['products','المنتجات'],['videos','الفيديوهات'],['missing','الأصناف الناقصة'],['settings','الإعدادات']];return `<div class=adminForm><label>اسم المدير<input id=mnm></label><label>رمز المدير<input id=mc></label><button class=primary onclick="addManager()">إضافة مدير</button></div><div class=adminList>${D.admins.map(m=>`<div class=adminCard><div><b>${esc(m.name)}</b><small>${m.owner?'المدير الرئيسي':'مدير تطبيق'}</small>${!m.owner?`<div class=permissions>${keys.map(([k,l])=>`<label><input type=checkbox ${m.permissions[k]?'checked':''} onchange="perm(${m.id},'${k}',this.checked)">${l}</label>`).join('')}</div>`:''}</div></div>`).join('')}</div>`}function addManager(){if(!mnm.value||!mc.value)return toast('اكتب اسم المدير والرمز');D.admins.push({id:Date.now(),name:mnm.value,code:mc.value,owner:false,permissions:{clients:false,orders:true,products:false,videos:false,missing:false,settings:false,admins:false}});save();render()}function perm(id,k,v){let m=D.admins.find(x=>x.id===id);m.permissions[k]=v;save()}
function logout(){client=null;admin=null;cart=[];setPage('home')}
function render(){let body=page==='home'?home():page==='register'?register():page==='login'?login():page==='shop'&&client?shop():page==='cart'&&client?cartPage():page==='orders'&&client?orders():page==='missing'&&client?missing():page==='videos'&&client?videos():page==='adminLogin'?adminLogin():page==='admin'&&admin?adminPage():home();document.getElementById('root').innerHTML=`<div class=app style="--bg:${D.settings.background?`url('${D.settings.background}')`: 'linear-gradient(135deg,#fff8ef,#ffe1c5)'}"><div class=wrap>${header()}${body}<div class=foot>كايرو كير — واتساب/شكاوى: ${esc(D.settings.whatsapp)} — التحويل: ${esc(D.settings.instagram)}</div></div></div>`}render();
</script></body></html>
