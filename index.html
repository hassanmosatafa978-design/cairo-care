async function saveRemoteSettings(){
  const {data,error}=await supabaseClient
    .from('settings')
    .select('id')
    .limit(1)
    .maybeSingle();

    return toast('خطأ في الإعدادات: '+error.message);

  const values={
    company:D.settings.company,
    slogan:D.settings.slogan,
    whatsapp:D.settings.whatsapp,
    instagram:D.settings.instagram,
    background:D.settings.background||'',
    updated_at:new Date().toISOString()
  };

  let result;

  if(data){
    result=await supabaseClient
      .from('settings')
      .update(values)
      .eq('id',data.id);
  }else{
    result=await supabaseClient
      .from('settings')
      .insert([values]);
  }

  if(result.error){
    return toast('لم يتم حفظ الإعدادات: '+result.error.message);
  }

  save();
  toast('تم حفظ الإعدادات للجميع ✅');
  render();
}

async function addToCart(id){
  id=String(id);

  let p=D.products.find(x=>String(x.id)===id);

  if(!p){
    const {data,error}=await supabaseClient
      .from('products')
      .select('*')
      .eq('id',id)
      .maybeSingle();

    if(error){
      return toast('خطأ Supabase: '+error.message);
    }

    if(!data){
      return toast('المنتج غير موجود');
    }

    p={
      id:String(data.id),
      name:data.name||'',
      category:data.category||'',
      description:data.description||'',
      price:Number(data.price)||0,
      stock:Number(data.stock)||0,
      image:data.image_url||'',
      active:data.active!==false
    };

    D.products.push(p);
  }

  let input=document.getElementById('qty_'+id);
  let qty=Number(input?.value||1);
  let maxQty=getClientMaxQty();

  if(!Number.isInteger(qty)||qty<1){
    return toast('من فضلك اكتب كمية صحيحة');
  }

  if(qty>maxQty){
    return toast('الحد الأقصى المسموح لك هو '+maxQty+' قطعة');
  }

  let item=cart.find(x=>String(x.id)===id);

  if(item){
    item.qty=qty;
  }else{
    cart.push({id:id,qty:qty});
  }

  save();
  toast('تمت إضافة المنتج للسلة 🛒');
  render();
}

function changeQty(id,n){
  id=String(id);
  n=Number(n);

  if(!Number.isInteger(n)||n===0)return;

  let item=cart.find(x=>String(x.id)===id);
  if(!item)return;

  let maxQty=getClientMaxQty();
  let nextQty=Number(item.qty)+n;

  if(nextQty<1){
    cart=cart.filter(x=>String(x.id)!==id);
    save();
    render();
    return;
  }

  if(nextQty>maxQty){
    return toast('الحد الأقصى المسموح لك هو '+maxQty+' قطعة');
  }

  item.qty=nextQty;

  save();
  render();
}

async function sendOrder(){
  if(!client)return toast('يجب تسجيل الدخول أولاً');
  if(!cart.length)return toast('السلة فارغة 🛒');

  const items=cart.map(x=>{
    const p=D.products.find(p=>String(p.id)===String(x.id));
    if(!p)return null;

    const qty=Number(x.qty)||1;
    const price=Number(p.price)||0;

    return {
      product_id:String(p.id),
      product_name:p.name||'',
      qty:qty,
      price:price,
      total:price*qty
    };
  }).filter(Boolean);

  if(!items.length)return toast('لا توجد منتجات صالحة في السلة');

  const total=items.reduce((sum,item)=>sum+item.total,0);

  const orderId=crypto.randomUUID();

  const {error:orderError}=await supabaseClient
    .from('orders')
    .insert({
      id:orderId,
      client_id:client.id,
      total:total,
      status:'جديد'
    });

  if(orderError){
    console.log('ORDER ERROR:',orderError);
    return toast('تعذر نقل الطلبية للإدارة:\\n'+orderError.message);
  }

  const rows=items.map(item=>({
    order_id:orderId,
    product_id:item.product_id,
    product_name:item.product_name,
    qty:item.qty,
    price:item.price,
    total:item.total
  }));

  const {error:itemsError}=await supabaseClient
    .from('order_items')
    .insert(rows);

  if(itemsError){
    console.log('ITEMS ERROR:',itemsError);

    await supabaseClient
      .from('orders')
      .delete()
      .eq('id',orderId);

    return toast('الرسالة: '+(itemsError.message||'')+' | الكود: '+(itemsError.code||'')+' | التفاصيل: '+(itemsError.details||'')+' | التلميح: '+(itemsError.hint||''));
  }

  cart=[];
  save();

  toast('تم نقل الطلبية إلى الإدارة بنجاح ✅');

  setPage('orders');
}

function formatOrderDateTime(v){
  if(!v) return 'غير محدد';
  const d=new Date(v);
  if(isNaN(d.getTime())) return 'غير محدد';
  return d.toLocaleString('ar-EG',{
    timeZone:'Africa/Cairo',
    year:'numeric',
    month:'2-digit',
    day:'2-digit',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function managersAdmin(){let keys=[['clients','العملاء'],['orders','الطلبات'],['products','المنتجات'],['videos','الفيديوهات'],['missing','الأصناف الناقصة'],['settings','الإعدادات']];return `<div class=adminForm><label>اسم المدير<input id=mnm></label><label>رمز المدير<input id=mc></label><button class=primary onclick="addManager()">إضافة مدير</button></div><div class=adminList>${D.admins.map(m=>`<div class=adminCard><div><b>${esc(m.name)}</b><small>${m.owner?'المدير الرئيسي':'مدير تطبيق'}</small>${!m.owner?`<div class=permissions>${keys.map(([k,l])=>`<label><input type=checkbox ${m.permissions[k]?'checked':''} onchange="perm(${m.id},'${k}',this.checked)">${l}</label>`).join('')}</div>`:''}</div></div>`).join('')}</div>`}function addManager(){if(!mnm.value||!mc.value)return toast('اكتب اسم المدير والرمز');D.admins.push({id:Date.now(),name:mnm.value,code:mc.value,owner:false,permissions:{clients:false,orders:true,products:false,videos:false,missing:false,settings:false,admins:false}});save();render()}function perm(id,k,v){let m=D.admins.find(x=>x.id===id);m.permissions[k]=v;save()}

function render(){let body=page==='home'?home():page==='register'?register():page==='login'?login():page==='shop'&&client?shop():page==='cart'&&client?cartPage():page==='orders'&&client?orders():page==='missing'&&client?missing():page==='videos'&&client?videos():page==='adminLogin'?adminLogin():page==='admin'&&admin?adminPage():home();document.getElementById('root').innerHTML=`<div class=app style="--bg:${D.settings.background?`url('${D.settings.background}')`: 'linear-gradient(135deg,#fff8ef,#ffe1c5)'}"><div class=wrap>${header()}${body}<div class=foot>كايرو كير — واتساب/شكاوى: ${esc(D.settings.whatsapp)} — التحويل: ${esc(D.settings.instagram)}</div></div></div>`}render();
</script></body></html>
